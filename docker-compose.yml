# Local development stack: only infrastructure services.
# Run the apps themselves with `pnpm dev`.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asafarim
      POSTGRES_USER: asafarim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asafarim_dev}
    ports:
      # Host port 55435: 5432 (and 55432-55434) are taken by other local
      # PostgreSQL instances on the dev machine.
      - "55435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6390: 6379/6380 are taken by other local Redis instances.
      - "6390:6379"
    volumes:
      - redis_data:/data

  # testora keeps its own database, isolated from the shared Prisma Postgres.
  # Matches TESTORA_DATABASE_URL (host port 55434).
  testora-postgres:
    image: postgres:16-alpine
    container_name: e2e-testora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: e2e_testora
      POSTGRES_PASSWORD: e2e_testora
      POSTGRES_DB: e2e-testing-db
    ports:
      - "55434:5432"
    volumes:
      - testora_pgdata:/var/lib/postgresql/data

  # appbuilder keeps its own database, isolated from the shared Prisma
  # Postgres and from testora's. Matches APPBUILDER_DATABASE_URL (host port
  # 55436). See docs/appbuilder-architecture.md.
  appbuilder-postgres:
    image: postgres:16-alpine
    container_name: appbuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: appbuilder_dev
      POSTGRES_DB: appbuilder
    ports:
      - "55436:5432"
    volumes:
      - appbuilder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbuilder -d appbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10

  # jobmatch keeps its own database, isolated from the shared Prisma
  # Postgres, from testora's, and from appbuilder's. Job listings are
  # high-volume and CV-derived data needs a stricter access boundary than
  # identity traffic — see apps/jobmatch/docs/business-plan.md.
  # Matches JOBMATCH_DATABASE_URL (host port 55437).
  jobmatch-postgres:
    image: pgvector/pgvector:pg16
    container_name: jobmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch_dev
      POSTGRES_DB: jobmatch
    ports:
      - "55437:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  testora_pgdata:
  appbuilder_pgdata:
  jobmatch_pgdata:
