<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="gMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark: graduation cap morphed with circuit/spark -->
  <g filter="url(#glow)">
    <!-- Cap board -->
    <polygon points="24,8 44,16 24,24 4,16" fill="url(#gMark)" opacity="0.95"/>
    <!-- Cap tassel hang -->
    <line x1="44" y1="16" x2="44" y2="28" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44" cy="30" r="2.5" fill="#34d399"/>
    <!-- Cap sides -->
    <path d="M10 19 L10 29 Q24 35 38 29 L38 19" stroke="#4ade80" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Spark / AI dot -->
    <circle cx="24" cy="16" r="2.5" fill="#ffffff" opacity="0.9"/>
    <!-- Circuit node lines -->
    <line x1="24" y1="24" x2="24" y2="32" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Wordmark: EduMatch -->
  <text x="54" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="22" fill="url(#gText)" letter-spacing="-0.5">Edu</text>
  <text x="96" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="22" fill="#d1fae5" letter-spacing="-0.5">Match</text>

  <!-- Underline accent -->
  <rect x="54" y="35" width="50" height="2" rx="1" fill="url(#gMark)" opacity="0.7"/>
</svg>
