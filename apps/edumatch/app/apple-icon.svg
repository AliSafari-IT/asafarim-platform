<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>
  <rect width="180" height="180" rx="38" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.35"/>
  <g filter="url(#glow)">
    <!-- Cap diamond -->
    <polygon points="90,38 148,68 90,98 32,68" fill="url(#cap)"/>
    <!-- Cap brim -->
    <path d="M50 76 L50 112 Q90 136 130 112 L130 76" stroke="#4ade80" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tassel -->
    <line x1="148" y1="68" x2="148" y2="112" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="148" cy="120" r="9" fill="#34d399"/>
    <!-- Spark -->
    <circle cx="90" cy="68" r="10" fill="#ffffff" opacity="0.9"/>
    <!-- Glow pulse ring -->
    <circle cx="90" cy="68" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  </g>
  <!-- "EM" monogram below cap -->
  <text x="90" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="26" fill="#4ade80" text-anchor="middle" letter-spacing="3" opacity="0.8">EM</text>
</svg>
