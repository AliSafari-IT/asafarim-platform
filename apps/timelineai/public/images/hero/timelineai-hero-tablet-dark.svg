<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
    <defs>
      <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5d4ee6" stop-opacity=".22"/>
        <stop offset="50%" stop-color="#67e8f9" stop-opacity=".42"/>
        <stop offset="100%" stop-color="#f6a84f" stop-opacity=".28"/>
