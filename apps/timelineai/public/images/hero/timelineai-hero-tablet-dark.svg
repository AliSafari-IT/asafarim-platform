      <linearGradient id="centerFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0f0d1a" stop-opacity=".06"/>
        <stop offset="45%" stop-color="#0f0d1a" stop-opacity="0.78"/>
        <stop offset="75%" stop-color="#0f0d1a" stop-opacity="0.78"/>
        <stop offset="100%" stop-color="#0f0d1a" stop-opacity=".10"/>
      </linearGradient>
    </defs>
