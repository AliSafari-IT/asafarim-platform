# Keeps the public proof board's changelog (showcase.asafarim.com/proof,
# apps/showcase/app/proof/data.ts) generated from real git history instead
# of hand-edited — see scripts/generate-changelog.mjs. Also refreshes the
# "Shipped packages and apps" workspace manifest (scripts/generate-workspace-manifest.mjs).
# Both go to the proof-data branch (main only takes PRs); see
# scripts/publish-proof-data.sh.

name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: proof-data-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip when the pushing actor is this workflow's own bot commit, and
    # respect [skip ci] like every other workflow here.
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Full history: the workspace manifest counts commits per folder.
          fetch-depth: 0

      - name: Regenerate changelog.json
        run: node scripts/generate-changelog.mjs

      - name: Regenerate workspace.json
        run: node scripts/generate-workspace-manifest.mjs

      - name: Publish to the proof-data branch
        run: >-
          scripts/publish-proof-data.sh
          "chore: regenerate changelog and workspace manifest"
          apps/showcase/public-data/changelog.json
          apps/showcase/public-data/workspace.json
