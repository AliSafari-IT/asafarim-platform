name: Deploy to VPS

# Builds immutable application images in GitHub Actions, publishes them to
# GHCR, then deploys the exact commit SHA to the VPS. The VPS only pulls and
# starts images; it never compiles the monorepo during a production rollout.
#
# Only the images a push actually affects are rebuilt. The plan job compares
# the commit with the last successfully deployed one (see
# scripts/plan-image-builds.mjs); every other image is re-tagged from that
# deploy, so the VPS still pulls a complete `<image>-<sha>` set for this
# commit. Targets that share a Dockerfile (e.g. appbuilder, its worker and its
# migrator) are built together in one job from docker-bake.hcl, sharing one
# install + build. Run the workflow manually with "rebuild_all" to rebuild
# every image.
#
# The GITHUB_TOKEN logs in to GHCR for both publishing and the short-lived
# remote pull. It is not persisted on the VPS.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST            e.g. 82.25.116.73
#   VPS_USER            e.g. root
#   VPS_SSH_KEY         private key whose public key is in the VPS authorized_keys
#   TELEGRAM_BOT_TOKEN  bot token from @BotFather
#   TELEGRAM_CHAT_ID    numeric chat ID for the destination chat
#   IS_DEPLOY_ON        "true" to allow build-images/deploy to run, anything
#                        else (including unset) skips them. A manual kill
#                        switch: building 20 images on every push to main
#                        got expensive, so this defaults closed rather than
#                        gating on a workflow file edit for every pause.

on:
  push:
    branches: [main]
    # Pushes that only touch docs or other workflows do not start a deploy.
    # Their changes still ship with the next deploy, and the plan job would
    # build nothing for them anyway; this just avoids a run for nothing.
    # Later patterns override earlier ones.
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!**/README.md"
      - "!**/CHANGELOG.md"
      - "!.claude/**"
      - "!.github/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every image instead of only the affected ones"
        type: boolean
        default: false

concurrency:
  group: vps-deploy
  # main is linear: a newer revision already contains every earlier commit, so
  # do not spend another full build deploying an obsolete revision. The VPS
  # script also holds an exclusive lock, which prevents overlapping remote
  # deploys if a canceled SSH process takes time to exit. A canceled run never
  # becomes the plan job's base, so the next run rebuilds what it changed.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # The plan job reads earlier runs of this workflow to find the last deploy.
  actions: read

env:
  IMAGE_REPOSITORY: ghcr.io/alisafari-it/asafarim-platform

jobs:
  plan:
    # Also the kill-switch check: a separate job for it cost a billed minute
    # on every push, even with deploys switched off.
    name: Plan image builds
    runs-on: ubuntu-latest
    outputs:
      deploy_on: ${{ steps.check.outputs.deploy_on }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check IS_DEPLOY_ON
        id: check
        env:
          DEPLOY_ON: ${{ secrets.IS_DEPLOY_ON }}
        run: |
          # Outputs are "enabled"/"disabled", never "true"/"false": GitHub refuses to
          # pass a job output that contains any secret value to other jobs ("Skip
          # output ... since it may contain secret"), so echoing the secret-equal
          # "true" left the output empty and every downstream job skipped.
          if [ "$DEPLOY_ON" = "true" ]; then
            echo "deploy_on=enabled" >> "$GITHUB_OUTPUT"
            echo "✅ \`IS_DEPLOY_ON\` is \`true\` — build-images and deploy will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy_on=disabled" >> "$GITHUB_OUTPUT"
            echo "⏸️ \`IS_DEPLOY_ON\` is not \`true\` — skipping build-images and deploy to save Actions minutes." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the \`IS_DEPLOY_ON\` repository secret to \`true\` (Settings > Secrets and variables > Actions) to re-enable, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out source
        if: steps.check.outputs.deploy_on == 'enabled'
        uses: actions/checkout@v5
        with:
          # The last deployed commit can be any number of commits back.
          fetch-depth: 0

      - name: Test the build planner
        if: steps.check.outputs.deploy_on == 'enabled'
        run: node --test scripts/plan-image-builds.test.mjs

      - name: Log in to GHCR
        if: steps.check.outputs.deploy_on == 'enabled'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The base is the newest run of this workflow on main whose deploy job
      # succeeded: all of its images are in GHCR and it is what production
      # runs. The run's overall conclusion is not enough — runs with the kill
      # switch off also conclude "success" without publishing anything.
      - name: Find the last deployed commit
        id: base
        if: steps.check.outputs.deploy_on == 'enabled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=""
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            deployed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length')"
            if [ "$deployed" != "0" ]; then
              base="$sha"
              break
            fi
          done <<< "$runs"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "Last deployed commit: ${base:-none}"

      - name: Decide which images to build
        id: plan
        if: steps.check.outputs.deploy_on == 'enabled'
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          FORCE_ALL: ${{ inputs.rebuild_all && 'true' || 'false' }}
          CHECK_REGISTRY: "true"
        run: node scripts/plan-image-builds.mjs

      # Unaffected images get this commit's tag on the previous deploy's
      # image. It is a registry-side manifest copy (seconds, no download), and
      # because the content is identical the VPS pull fetches nothing for it.
      - name: Re-tag unaffected images
        if: steps.check.outputs.deploy_on == 'enabled' && steps.plan.outputs.reuse != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          REUSE: ${{ steps.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          for image in $REUSE; do
            echo "${image}: ${BASE_SHA} -> ${GITHUB_SHA}"
            docker buildx imagetools create \
              --tag "${IMAGE_REPOSITORY}:${image}-${GITHUB_SHA}" \
              "${IMAGE_REPOSITORY}:${image}-${BASE_SHA}"
          done

  build-images:
    name: Build ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.deploy_on == 'enabled' && needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One entry per Dockerfile: {group, targets}, targets comma-separated.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # These NEXT_PUBLIC_* values are not secret — they end up verbatim in
      # the client-side JS bundle — so they live in .env.production.example,
      # the same committed, unencrypted file that documents what
      # .env.production.age must contain. Reading them from there (instead of
      # duplicating them as literals in this workflow) means an operator who
      # updates a public URL or the company name only has to edit one file
      # for the build to pick it up, rather than two silently drifting apart.
      # docker-bake.hcl picks them up from the environment as build args; a
      # new NEXT_PUBLIC_* key must also be declared there.
      - name: Load public build configuration
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < <(grep -E '^NEXT_PUBLIC_[A-Z_]+=' .env.production.example)

      - name: Build and publish immutable images
        uses: docker/bake-action@v7
        env:
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        with:
          source: .
          # Explicit, or bake would also merge docker-compose.yml.
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          push: true

  deploy:
    needs: [plan, build-images]
    # build-images is skipped when no image is affected (e.g. a push that
    # only changes Compose, Caddy or the VPS scripts); that still deploys.
    # A skipped dependency would otherwise skip this job, hence !cancelled().
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.deploy_on == 'enabled'
      && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # A literal, not a reference to the workflow-level env block above, on
      # purpose: this job's ssh-action step forwards IMAGE_REPOSITORY to the
      # VPS via `envs:`, which reads the job's own process environment.
      # Referencing `${{ env.IMAGE_REPOSITORY }}` here would still depend on
      # the workflow-level block existing — a future edit that moves it into
      # build-images' own scope (it looks like the "natural" place, since
      # only that job's matrix references it directly) would make this
      # resolve to empty too, and vps-deploy.sh would silently fall back to
      # its own hardcoded default instead of failing loudly. Keep this in
      # sync with the workflow-level `env.IMAGE_REPOSITORY` above.
      IMAGE_REPOSITORY: ghcr.io/alisafari-it/asafarim-platform
      IMAGE_TAG: ${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      # 2026-08-10: a deploy failed with `dial tcp ***:22: i/o timeout` even
      # though the VPS was up and a prior run had connected ~4 min earlier.
      # No sshd log entry was produced, so the runner's SYN never arrived — a
      # transient network drop between the Azure runner and the VPS. The default
      # 30s connection timeout gave no room to ride it out. This preflight
      # retries TCP :22 reachability before handing off to ssh-action, and
      # `timeout: 60s` below widens the SSH handshake window.
      - name: Wait for VPS reachable on :22 (retry)
        run: |
          host="${{ secrets.VPS_HOST }}"
          for i in 1 2 3 4 5 6; do
            if nc -z -w5 "$host" 22 2>/dev/null; then
              echo "VPS reachable on :22 (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/6 failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::VPS unreachable on :22 after 6 attempts"
          exit 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Connection (handshake) timeout — distinct from command_timeout.
          # Default is 30s, which is too tight for transient Azure<->VPS blips.
          timeout: 60s
          # Pulling and replacing prebuilt images should normally take
          # minutes, but a cold VPS image cache (e.g. right after
          # cleanup-docker.sh, or a fresh box) has zero layer overlap with
          # GHCR — a full pull of 20 images can plausibly take much longer
          # than a warm-cache run. 45m leaves real margin for that case
          # without masking a genuinely stuck rollout the way 60m (sized for
          # sequential VPS *builds*, which this pipeline no longer does) would.
          command_timeout: 45m
          envs: IMAGE_REPOSITORY,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            cd /var/repos/asafarim-com
            git fetch --prune origin main
            # Extract the target commit's vps-deploy.sh into an untracked,
            # uniquely-named copy under infra/scripts/ (so its relative
            # `lib/` source still resolves) and run THAT, instead of
            # resetting the tracked working tree and opening the tracked
            # file directly. Two hazards, one fix:
            #   - self-modification (2026-09-15 incident): the tracked
            #     vps-deploy.sh does its own `git reset --hard` partway
            #     through, rewriting itself on disk while bash is still
            #     mid-execution of it. Bash's already-open file descriptor
            #     keeps reading the pre-reset bytes for the rest of that
            #     run, so it silently finishes executing whatever was
            #     checked out *before* this script started — a fully
            #     stale, possibly pre-redesign version — with no error.
            #     Running from a separate, untracked file means that
            #     internal reset can never touch the file bash is reading.
            #   - overlapping deploys (Devin review on PR #383): resetting
            #     the whole tree here, before vps-deploy.sh acquires its
            #     flock lock, let a canceled-but-still-alive older deploy
            #     have the shared checkout rewritten out from under it
            #     mid-rollout. `git show <ref>:<path>` reads straight from
            #     the object database and touches no tracked file, so the
            #     only full-tree `git reset --hard` now happens inside
            #     vps-deploy.sh itself, after it holds the lock — a second
            #     deploy blocks on that lock instead of racing the first.
            BOOTSTRAP="infra/scripts/.vps-deploy.${IMAGE_TAG}.sh"
            trap 'rm -f "$BOOTSTRAP"' EXIT
            git show "${IMAGE_TAG}:infra/scripts/vps-deploy.sh" > "$BOOTSTRAP"
            bash "$BOOTSTRAP"

  notify:
    runs-on: ubuntu-latest
    needs: [plan, build-images, deploy]
    # Skip entirely when the kill switch skipped build-images/deploy too --
    # a Telegram message every push to main saying "deploy skipped" would be
    # pure noise. The plan job's own step summary already records why.
    if: always() && needs.plan.outputs.deploy_on == 'enabled'
    steps:
      - name: Notify Telegram on success
        if: needs.deploy.result == 'success'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deployment succeeded for asafarim-platform
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}

      - name: Notify Telegram on failure
        if: needs.plan.result == 'failure' || needs.build-images.result == 'failure' || needs.deploy.result == 'failure'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deployment FAILED for asafarim-platform
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            See logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
