# Publishes accessibility/performance snapshots for the public proof board
# (showcase.asafarim.com/proof, apps/showcase/app/proof/data.ts).
#
# Runs Lighthouse against the *deployed* showcase — not a local build — since
# a fresh build needs decrypted secrets that this workflow deliberately
# doesn't have (see ci-status.yml's build exclusion for the same reasoning).
# Only category scores + a timestamp are published; no raw report content.
# The snapshot goes to the proof-data branch (main only takes PRs); see
# scripts/publish-proof-data.sh.

name: Lighthouse snapshots

on:
  schedule:
    - cron: "17 4 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: proof-data-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://showcase.asafarim.com/
            https://showcase.asafarim.com/proof
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches from package.json's packageManager (pnpm), but this
          # job never installs pnpm or dependencies — the cache step would fail.
          package-manager-cache: false

      - name: Summarize into the public snapshot
        run: node scripts/lighthouse-summary.mjs

      - name: Publish snapshot to the proof-data branch
        run: >-
          scripts/publish-proof-data.sh
          "chore: update Lighthouse a11y/perf snapshot"
          apps/showcase/public-data/lighthouse-status.json
