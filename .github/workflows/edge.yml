# Shared edge gateway (#770 / #774): shellcheck the edge scripts, run the
# behaviour tests of edge-deploy-site.sh (lock, .prev restore, validation
# before the swap) against a fake docker, and (phase 2) check that the edge's
# site files route exactly what infra/caddy/Caddyfile routes today. Linux only:
# the script needs flock; the config check needs Docker (the pinned caddy).
# Also the igs-pharma.be stack's deploy helpers and site file (#822), and the
# proxy steps of vps-deploy.sh before and after the cutover (lib/proxy.sh).
name: Edge

on:
  pull_request:
    paths:
      - "infra/edge/**"
      - "infra/caddy/**"
      - "infra/scripts/lib/edge.sh"
      - "infra/scripts/lib/proxy.sh"
      - "infra/scripts/lib/verify-caddy.sh"
      - "infra/scripts/vps-deploy.sh"
      - "infra/scripts/proxy.test.mjs"
      - "infra/igs/**"
      - "infra/scripts/igs-deploy.sh"
      - "infra/scripts/igs-healthcheck.sh"
      - "infra/scripts/igs-backup.sh"
      - "infra/scripts/igs-restore-drill.sh"
      - "infra/scripts/igs-db-roles.sh"
      - "infra/scripts/igs-cli.sh"
      - "infra/scripts/lib/igs.sh"
      - "docker-compose.prod.yml"
      - ".github/workflows/edge.yml"
      - ".github/workflows/igs-deploy.yml"
  push:
    branches: [main]
    paths:
      - "infra/edge/**"
      - "infra/caddy/**"
      - "infra/scripts/lib/edge.sh"
      - "infra/scripts/lib/proxy.sh"
      - "infra/scripts/lib/verify-caddy.sh"
      - "infra/scripts/vps-deploy.sh"
      - "infra/scripts/proxy.test.mjs"
      - "infra/igs/**"
      - "infra/scripts/igs-deploy.sh"
      - "infra/scripts/igs-healthcheck.sh"
      - "infra/scripts/igs-backup.sh"
      - "infra/scripts/igs-restore-drill.sh"
      - "infra/scripts/igs-db-roles.sh"
      - "infra/scripts/igs-cli.sh"
      - "infra/scripts/lib/igs.sh"
      - "docker-compose.prod.yml"
      - ".github/workflows/edge.yml"
      - ".github/workflows/igs-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No install here (see brand-spelling.yml).
          package-manager-cache: false
      - name: shellcheck
        run: shellcheck -S warning infra/edge/scripts/*.sh infra/scripts/lib/edge.sh infra/scripts/lib/proxy.sh infra/scripts/vps-deploy.sh infra/scripts/lib/igs.sh infra/scripts/igs-deploy.sh infra/scripts/igs-healthcheck.sh infra/scripts/igs-backup.sh infra/scripts/igs-restore-drill.sh infra/scripts/igs-db-roles.sh infra/scripts/igs-cli.sh infra/igs/postgres-tls-init.sh infra/igs/deploy-key-wrapper.sh
      - name: edge-deploy-site.sh behaviour
        run: node --test infra/edge/scripts/edge-deploy-site.test.mjs
      - name: The edge config routes what production routes today
        run: node --test infra/edge/scripts/edge-config.test.mjs
      - name: edge-cutover-check.sh, the read-only cutover check (#839)
        run: node --test infra/edge/scripts/edge-cutover-check.test.mjs
      - name: edge_net membership is an explicit allow-list
        run: node --test infra/edge/scripts/edge-net.test.mjs
      - name: vps-deploy.sh works before and after the edge cutover (#770 phase 3)
        run: node --test infra/scripts/proxy.test.mjs
      - name: igs-pharma staging deploy helpers (#822)
        run: node --test infra/igs/igs-deploy.test.mjs
      - name: igs automatic staging deploy key and workflow (#833)
        run: node --test infra/igs/deploy-key-wrapper.test.mjs
      - name: Install age (backup encryption tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: igs nightly encrypted backups and restore drill (#829)
        run: node --test infra/igs/igs-backup.test.mjs
