# ResuMatch quality gate (JM-014).
#
# ResuMatch is kept out of ci-status.yml on purpose: that workflow publishes
# the traceable proof-board artifact over `packages/*` tests, and widening
# its method string is a separate decision. This workflow instead runs the
# checks that are specific to ResuMatch — including the one no other app
# needs, that its Prisma migrations actually apply to an empty database.
name: ResuMatch CI

on:
  push:
    branches: [main]
    paths:
      - "apps/resumatch/**"
      - "packages/auth/**"
      - "packages/ui/**"
      - ".github/workflows/resumatch-ci.yml"
  pull_request:
    paths:
      - "apps/resumatch/**"
      - "packages/auth/**"
      - "packages/ui/**"
      - ".github/workflows/resumatch-ci.yml"
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # A throwaway database for the migration check. ResuMatch must never be
      # pointed at a shared or developer database by a test run — see
      # apps/resumatch/docs/threat-model.md#test-data-isolation.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resumatch
          POSTGRES_PASSWORD: resumatch_ci
          POSTGRES_DB: resumatch_ci
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U resumatch -d resumatch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @asafarim/resumatch typecheck

      - name: Unit tests
        run: pnpm --filter @asafarim/resumatch test

      - name: Registry and auth tests
        run: pnpm --filter @asafarim/auth test

      - name: Migrations apply to an empty database
        run: pnpm --filter @asafarim/resumatch exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          RESUMATCH_DATABASE_URL: postgresql://resumatch:resumatch_ci@localhost:55437/resumatch_ci

      - name: Create the throwaway shadow database
        run: |
          PGPASSWORD=resumatch_ci psql -h localhost -p 55437 -U resumatch -d resumatch_ci \
            -c "DROP DATABASE IF EXISTS resumatch_shadow;" -c "CREATE DATABASE resumatch_shadow;"

      - name: Schema matches its migrations
        # Catches the classic drift: a schema.prisma edit shipped without the
        # migration that would produce it.
        run: pnpm --filter @asafarim/resumatch exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          RESUMATCH_DATABASE_URL: postgresql://resumatch:resumatch_ci@localhost:55437/resumatch_ci
          RESUMATCH_SHADOW_DATABASE_URL: postgresql://resumatch:resumatch_ci@localhost:55437/resumatch_shadow
