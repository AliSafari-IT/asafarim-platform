# Publishes a traceable CI status artifact for the public proof board
# (showcase.asafarim.com/proof, apps/showcase/app/proof/data.ts).
#
# Runs the checks that don't need decrypted secrets — lint, typecheck, and
# package tests. `build` is excluded: a full monorepo build needs decrypted
# DB/auth secrets, which is a separate infra decision. See
# docs/proof-board-plan.md and scripts/ci-status-summary.mts.
#
# The published artifact (ci-status.json + its .sha256) is what makes the
# result traceable to the exact commit/run that produced it, per issue #13's
# "CI publishes signed or traceable benchmark artifacts" acceptance criterion.
#
# A full `pnpm install --frozen-lockfile` across this monorepo is expensive
# on its own. IS_CI_ON (repository secret) is a separate switch from
# deploy.yml's IS_DEPLOY_ON: unlike deploy (rare, opt-in, defaults closed),
# this runs lint/typecheck/tests on every push and PR, so it defaults OPEN
# (runs unless the secret is explicitly set to "false") rather than closed —
# turning it off silences routine CI feedback entirely, not just an
# expensive deploy step.

name: CI status

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ci_on: ${{ steps.check.outputs.ci_on }}
    steps:
      - name: Check IS_CI_ON
        id: check
        env:
          CI_ON: ${{ secrets.IS_CI_ON }}
        run: |
          if [ "$CI_ON" = "false" ]; then
            echo "ci_on=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ \`IS_CI_ON\` is \`false\` — skipping lint/typecheck/tests to save Actions minutes." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the \`IS_CI_ON\` repository secret to anything other than \`false\` (or delete it) to re-enable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ci_on=true" >> "$GITHUB_OUTPUT"
            echo "✅ \`IS_CI_ON\` is not \`false\` — running lint/typecheck/tests." >> "$GITHUB_STEP_SUMMARY"
          fi

  status:
    needs: gate
    if: needs.gate.outputs.ci_on == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and publish status summary
        run: pnpm tsx scripts/ci-status-summary.mts

      - name: Upload traceable status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-${{ github.sha }}
          path: ci-status-artifact/
          retention-days: 90
          if-no-files-found: error
