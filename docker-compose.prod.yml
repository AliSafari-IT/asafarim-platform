services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asafarim
      POSTGRES_USER: asafarim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to loopback only: lets host-side scripts (migrate/seed) connect
      # without exposing postgres to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Needed so platform-migrate can wait for a database that actually accepts
    # connections rather than one whose container has merely started; the app
    # services tolerate a cold database by retrying, but a one-shot migration
    # job that starts too early just fails the deploy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asafarim -d asafarim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # Applies pending Prisma migrations to the SHARED platform database, then
  # plants the TimelineAI demo timelines if (and only if) none exist yet.
  # Runs to completion before any app that reads this database starts, so a
  # deploy can no longer ship an app whose tables were never created — the
  # failure mode that took tlai.asafarim.com/gallery down with
  # "table public.Timeline does not exist".
  platform-migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:platform-migrate-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: packages/db/Dockerfile
      target: migrator
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:web-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: &public-build-args
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME}
        NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME}
        NEXT_PUBLIC_HUB_NAME: ${NEXT_PUBLIC_HUB_NAME}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
        NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL}
        NEXT_PUBLIC_SHOWCASE_URL: ${NEXT_PUBLIC_SHOWCASE_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_VIONTO_URL: ${NEXT_PUBLIC_VIONTO_URL}
        NEXT_PUBLIC_EDUMATCH_URL: ${NEXT_PUBLIC_EDUMATCH_URL:-https://edumatch.asafarim.com}
        NEXT_PUBLIC_TESTORA_URL: ${NEXT_PUBLIC_TESTORA_URL}
        NEXT_PUBLIC_APPBUILDER_URL: ${NEXT_PUBLIC_APPBUILDER_URL}
        NEXT_PUBLIC_TIMELINEAI_URL: ${NEXT_PUBLIC_TIMELINEAI_URL:-https://tlai.asafarim.com}
        NEXT_PUBLIC_DEVTOOLS_URL: ${NEXT_PUBLIC_DEVTOOLS_URL:-https://asafarim.be}
        NEXT_PUBLIC_LABS_URL: ${NEXT_PUBLIC_LABS_URL:-https://labs.asafarim.com}
        NEXT_PUBLIC_RESUMATCH_URL: ${NEXT_PUBLIC_RESUMATCH_URL:-https://resumatch.asafarim.com}
        NEXT_PUBLIC_TASKSAI_URL: ${NEXT_PUBLIC_TASKSAI_URL:-https://tasks-ai.asafarim.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://asafarim.com
      AUTH_URL: https://asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  hub:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:hub-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://hub.asafarim.com
      AUTH_URL: https://hub.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  showcase:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:showcase-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/showcase/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://showcase.asafarim.com
      AUTH_URL: https://showcase.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  admin:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:admin-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://admin.asafarim.com
      AUTH_URL: https://admin.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - asafarim_net

  vionto:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:vionto-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/vionto/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://vionto.asafarim.com
      AUTH_URL: https://vionto.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  vionto-worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:vionto-worker-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.vionto-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    networks:
      - asafarim_net

  edumatch:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:edumatch-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/edumatch/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://edumatch.asafarim.com
      NEXT_PUBLIC_EDUMATCH_URL: https://edumatch.asafarim.com
      AUTH_URL: https://edumatch.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    # /api/status pings the database and returns a non-2xx when it can't
    # reach it (see apps/edumatch/app/api/status/route.ts), so this reflects
    # real service health, not just "the process is running". The runner
    # image is node:24-alpine — busybox wget is present by default, curl is
    # not. #162.
    healthcheck:
      # Alpine's musl libc resolves "localhost" to ::1 (IPv6) before
      # 127.0.0.1, and Next.js's standalone server here binds IPv4-only —
      # so a "localhost" healthcheck gets connection-refused on the IPv6
      # attempt forever, even while the app serves traffic fine over IPv4.
      # Confirmed live: `wget http://127.0.0.1:3000/...` succeeds inside the
      # container while `wget http://localhost:3000/...` and the explicit
      # `http://[::1]:3000/...` both fail. Use the literal IPv4 loopback.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - asafarim_net

  timelineai:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:timelineai-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/timelineai/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://tlai.asafarim.com
      NEXT_PUBLIC_TIMELINEAI_URL: https://tlai.asafarim.com
      AUTH_URL: https://tlai.asafarim.com
      # Self-referencing URL for the export pipeline's headless Chromium
      # (lib/server/services/export.ts) — internal container networking,
      # not the public domain, so exports don't round-trip through Caddy/TLS.
      TIMELINEAI_INTERNAL_URL: http://localhost:3000
      TIMELINEAI_GUEST_IP_HASH_KEY: ${TIMELINEAI_GUEST_IP_HASH_KEY}
      # HMAC key signing the short-lived render grant for the export pipeline
      # (lib/server/render-grant.ts). Without this, exports fail.
      TIMELINEAI_RENDER_GRANT_SECRET: ${TIMELINEAI_RENDER_GRANT_SECRET}
      # Caddy is one hop in front of every app in this stack.
      TIMELINEAI_TRUSTED_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  # Labs is intentionally the simplest service in this stack: a static
  # experiment registry with no auth, no shared database, and no worker —
  # see apps/labs/README.md. It only needs the app switcher's cross-app URLs.
  labs:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:labs-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/labs/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://labs.asafarim.com
    networks:
      - asafarim_net

  # testora keeps its OWN database, isolated from the shared Prisma Postgres.
  testora-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: e2e_testora
      POSTGRES_PASSWORD: ${TESTORA_DB_PASSWORD}
      POSTGRES_DB: e2e-testing-db
    ports:
      # Loopback only: lets host-side scripts (seed/inspect) reach it without
      # exposing testora's DB to the internet.
      - "127.0.0.1:5434:5432"
    volumes:
      - testora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_testora -d e2e-testing-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # One-shot: applies pending drizzle migrations, then exits. The app waits for
  # this to complete successfully before starting.
  testora-migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:testora-migrator-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: migrator
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
    depends_on:
      testora-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # One-shot: reconciles the DB catalog (apps, requirements, suites, fixtures,
  # cases, target environments) with the code under src/data — the same thing
  # the Run page's "Update tests" button does, just run automatically on every
  # deploy so a catalog change (e.g. adding/removing an app under test) ships
  # without someone having to click the button in prod afterwards. Runs after
  # migrations so the schema it writes against is current.
  testora-seed:
    # The seed and migration jobs intentionally share one prebuilt image.
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:testora-migrator-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: migrator
    command: ["pnpm", "--filter", "testora", "db:seed"]
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
    depends_on:
      testora-postgres:
        condition: service_healthy
      testora-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  testora:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:testora-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: runner
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
      NEXT_PUBLIC_APP_URL: https://testora.asafarim.com
    depends_on:
      testora-postgres:
        condition: service_healthy
      testora-migrate:
        condition: service_completed_successfully
      testora-seed:
        condition: service_completed_successfully
    networks:
      - asafarim_net
      - testora_control

  # Isolated test runner (#718, ADR 0004 §1, §5). Pulls jobs from `testora`
  # over testora_control and reaches targets over testora_egress, whose
  # traffic the host filters (infra/scripts/testora-egress-firewall.sh). Never
  # on asafarim_net: it can't resolve or route to postgres, redis or any app.
  # Opt-in profile: vps-deploy.sh enables it only when TESTORA_RUNNER_TOKEN is
  # set in .env.production, after the Caddy /internal/* block and the control
  # network are live (#723).
  testora-runner:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:testora-runner-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: runner-worker
    profiles: ["testora-runner"]
    restart: unless-stopped
    # No env_file: the runner gets its control URL, credentials and limits,
    # nothing else from the platform's environment.
    environment:
      TESTORA_CONTROL_URL: http://testora:3000
      TESTORA_RUNNER_TOKEN: ${TESTORA_RUNNER_TOKEN:-}
      TESTORA_RUNNER_SIGNING_SECRETS: ${TESTORA_RUNNER_SIGNING_SECRETS:-}
      TESTORA_RUNNER_CONCURRENCY: ${TESTORA_RUNNER_CONCURRENCY:-2}
      TESTORA_EGRESS_SELF_TEST: "1"
      E2E_BROWSER: "chromium:headless --no-sandbox --disable-gpu --disable-dev-shm-usage"
    read_only: true
    # /tmp: per-job specs, Chromium profiles and artifacts. HOME: Chromium
    # writes ~/.config and ~/.cache even headless.
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/node:size=256m,uid=1000,gid=1000,mode=0700
    user: node
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Sized for the default concurrency of 2: two Chromiums plus Node and the
    # tmpfs (which counts against the memory limit).
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    shm_size: 1g
    depends_on:
      - testora
    networks:
      - testora_control
      - testora_egress

  # appbuilder keeps its OWN database, isolated from the shared Prisma
  # Postgres and from testora's/others' app-local databases.
  appbuilder-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: ${APPBUILDER_DB_PASSWORD}
      POSTGRES_DB: appbuilder
    # No published port: private to asafarim_net. AppBuilder has no public
    # production service yet (ships in M11), so there is no host-side script
    # that needs loopback access the way testora's does.
    volumes:
      - appbuilder_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbuilder -d appbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # One-shot: applies pending drizzle migrations, then exits. Idempotent —
  # drizzle's migration journal makes reruns against an already-migrated
  # database a no-op. AppBuilder's own app service is not deployed yet (M11);
  # this job exists so the database and its migration lifecycle are already
  # correct and testable ahead of that milestone.
  appbuilder-migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:appbuilder-migrate-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      # APPBUILDER_DB_PASSWORD_URL is the URL-encoded form of
      # APPBUILDER_DB_PASSWORD (which may contain chars like '/' that are
      # illegal unencoded in a URI userinfo). POSTGRES_PASSWORD uses the raw
      # value; connection strings must use the encoded one.
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
    depends_on:
      appbuilder-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # M07 AI generation worker — a standalone process, not the Next.js app
  # (which is not deployed yet, M11; see appbuilder-migrate above for the
  # same "staged ahead of the app itself" rationale). Consumes BullMQ
  # dispatch messages on the shared `redis` instance and drives
  # generation_jobs rows in appbuilder-postgres forward; see
  # docs/appbuilder-m07-ai-generation.md. Defaults to the deterministic fake
  # provider (APPBUILDER_AI_PROVIDER) so this service never makes a billable
  # call until an operator explicitly opts into "openai" with a real key.
  appbuilder-worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:appbuilder-worker-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
      REDIS_URL: redis://redis:6379
      APPBUILDER_AI_PROVIDER: ${APPBUILDER_AI_PROVIDER:-fake}
      APPBUILDER_AI_OPENAI_API_KEY: ${APPBUILDER_AI_OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      APPBUILDER_WORKER_CONCURRENCY: ${APPBUILDER_WORKER_CONCURRENCY:-2}
      APPBUILDER_WORKER_HEALTH_PORT: "3008"
    depends_on:
      appbuilder-postgres:
        condition: service_healthy
      appbuilder-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - asafarim_net

  appbuilder:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:appbuilder-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: runner
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://appbuilder.asafarim.com
      AUTH_URL: https://appbuilder.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
      appbuilder-postgres:
        condition: service_healthy
      appbuilder-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - asafarim_net

  # resumatch keeps its OWN database, isolated from the shared Prisma
  # Postgres. pgvector is on the image from a prior milestone's plans;
  # nothing here actually uses the extension since the pivot away from
  # embedding-based matching, but swapping the base image later would mean
  # doing so on a database that already holds candidate data.
  resumatch-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumatch
      POSTGRES_PASSWORD: ${RESUMATCH_DB_PASSWORD}
      POSTGRES_DB: resumatch
    ports:
      # Loopback only: host-side scripts can reach it; the internet cannot.
      - "127.0.0.1:5437:5432"
    volumes:
      - resumatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumatch -d resumatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  resumatch-migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:resumatch-migrate-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/resumatch/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      # RESUMATCH_DB_PASSWORD_URL is the URL-encoded form of
      # RESUMATCH_DB_PASSWORD; connection strings must use the encoded one.
      RESUMATCH_DATABASE_URL: postgres://resumatch:${RESUMATCH_DB_PASSWORD_URL}@resumatch-postgres:5432/resumatch
    depends_on:
      resumatch-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # ClamAV sidecar for CV malware scanning (JM-018, issue #203). Kept on the
  # internal network only — nothing outside the Docker network can reach
  # port 3310, and resumatch is the only service configured to.
  #
  # No volume for the virus database is a deliberate simplification for a
  # single-instance deployment: `/init` (the image's own entrypoint) runs
  # freshclam once before starting clamd, so the container is unusable for
  # a few minutes after every restart while it downloads the database fresh
  # — acceptable because uploads fail closed (quarantine) during that
  # window rather than unsafely, and resumatch does not wait on clamav's own
  # health to start serving. Add a named volume mounted at /var/lib/clamav
  # if restart frequency ever makes the redownload costly.
  clamav:
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ClamAV's full signature set easily needs 1-1.5GB resident; this
          # caps it well short of starving the other services on an 8GB box
          # while leaving headroom for signature-database growth.
          memory: 2g
    networks:
      - asafarim_net
    # The image ships its own HEALTHCHECK (clamdcheck.sh) with a 6-minute
    # start period — freshclam's first run has to finish before clamd can
    # answer PING, and that is intentionally not shortened here.

  # NOTE: NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_RESUMATCH_URL / AUTH_URL below
  # assume resumatch.asafarim.com has a DNS record pointed at this host and
  # a matching vhost in infra/caddy/Caddyfile (both already updated in this
  # rename) — provision the DNS record and reload Caddy before deploying,
  # or the domain will not resolve / TLS will not issue.
  resumatch:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:resumatch-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/resumatch/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      RESUMATCH_ENVIRONMENT: production
      RESUMATCH_DATABASE_URL: postgres://resumatch:${RESUMATCH_DB_PASSWORD_URL}@resumatch-postgres:5432/resumatch
      NEXT_PUBLIC_APP_URL: https://resumatch.asafarim.com
      # Also passed as a build arg above, where Next inlines it into the
      # pages. Repeated here so the value exists in the server's own
      # environment too, rather than the runtime depending on what a build
      # happened to bake in.
      NEXT_PUBLIC_RESUMATCH_URL: ${NEXT_PUBLIC_RESUMATCH_URL:-https://resumatch.asafarim.com}
      AUTH_URL: https://resumatch.asafarim.com
      RESUMATCH_SCANNER_URL: tcp://clamav:3310
    depends_on:
      resumatch-postgres:
        condition: service_healthy
      resumatch-migrate:
        condition: service_completed_successfully
      # Not service_healthy: clamav's first-boot signature download can take
      # several minutes, and resumatch is designed to run without it —
      # uploads quarantine (fail closed) until clamav reports healthy,
      # rather than resumatch itself refusing to start.
      clamav:
        condition: service_started
    networks:
      - asafarim_net

  # TasksAI keeps its OWN database, isolated from the shared Prisma
  # Postgres and from every other app's — the tenant work graph needs its
  # own migration cadence and backup/retention boundary
  # (apps/tasks-ai/docs/adr/0001-dedicated-database.md).
  tasksai-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasksai
      POSTGRES_PASSWORD: ${TASKSAI_DB_PASSWORD}
      POSTGRES_DB: tasksai
    ports:
      # Loopback only: host-side scripts can reach it; the internet cannot.
      - "127.0.0.1:5438:5432"
    volumes:
      - tasksai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksai -d tasksai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # One-shot: applies TasksAI's Prisma migrations before the app starts, so
  # a deploy can never ship a TasksAI whose tables were never created.
  tasksai-migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:tasksai-migrate-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/tasks-ai/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      # TASKSAI_DB_PASSWORD_URL is the URL-encoded form of TASKSAI_DB_PASSWORD.
      TASKSAI_DATABASE_URL: postgres://tasksai:${TASKSAI_DB_PASSWORD_URL}@tasksai-postgres:5432/tasksai
    depends_on:
      tasksai-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # BullMQ background worker: outbox drainer (notifications, automation
  # fan-out), webhook delivery, rate-counter prune. Same image as the
  # runner, different entrypoint.
  tasksai-worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:tasksai-worker-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/tasks-ai/Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TASKSAI_ENVIRONMENT: production
      TASKSAI_DATABASE_URL: postgres://tasksai:${TASKSAI_DB_PASSWORD_URL}@tasksai-postgres:5432/tasksai
      TASKSAI_REDIS_URL: redis://redis:6379
    depends_on:
      tasksai-postgres:
        condition: service_healthy
      tasksai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - asafarim_net

  tasksai:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/asafarim-platform}:tasksai-${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/tasks-ai/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TASKSAI_ENVIRONMENT: production
      TASKSAI_DATABASE_URL: postgres://tasksai:${TASKSAI_DB_PASSWORD_URL}@tasksai-postgres:5432/tasksai
      TASKSAI_REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://tasks-ai.asafarim.com
      # Also a build arg above (Next inlines it into the pages); repeated
      # here so the value exists in the server's own environment too.
      NEXT_PUBLIC_TASKSAI_URL: ${NEXT_PUBLIC_TASKSAI_URL:-https://tasks-ai.asafarim.com}
      AUTH_URL: https://tasks-ai.asafarim.com
    depends_on:
      tasksai-postgres:
        condition: service_healthy
      tasksai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - asafarim_net

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - hub
      - showcase
      - admin
      - vionto
      - edumatch
      - testora
      - appbuilder
      - resumatch
      - tasksai
    networks:
      - asafarim_net

networks:
  asafarim_net:
  # Runner ↔ web only (#718): no gateway, no internet.
  testora_control:
    internal: true
  # The runner's way out. Fixed subnet: the host egress filter matches on it
  # (infra/scripts/testora-egress-firewall.sh — keep the two in sync; a test
  # checks). No IPv6 until there is an ip6tables equivalent.
  testora_egress:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.254.0/24

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  testora_postgres_data:
  appbuilder_postgres_data:
  tasksai_postgres_data:
  resumatch_postgres_data:
