services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asafarim
      POSTGRES_USER: asafarim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to loopback only: lets host-side scripts (migrate/seed) connect
      # without exposing postgres to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Needed so platform-migrate can wait for a database that actually accepts
    # connections rather than one whose container has merely started; the app
    # services tolerate a cold database by retrying, but a one-shot migration
    # job that starts too early just fails the deploy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asafarim -d asafarim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # Applies pending Prisma migrations to the SHARED platform database, then
  # plants the TimelineAI demo timelines if (and only if) none exist yet.
  # Runs to completion before any app that reads this database starts, so a
  # deploy can no longer ship an app whose tables were never created — the
  # failure mode that took tlai.asafarim.com/gallery down with
  # "table public.Timeline does not exist".
  platform-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
      target: migrator
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: &public-build-args
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME}
        NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME}
        NEXT_PUBLIC_HUB_NAME: ${NEXT_PUBLIC_HUB_NAME}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
        NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL}
        NEXT_PUBLIC_SHOWCASE_URL: ${NEXT_PUBLIC_SHOWCASE_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_VIONTO_URL: ${NEXT_PUBLIC_VIONTO_URL}
        NEXT_PUBLIC_EDUMATCH_URL: ${NEXT_PUBLIC_EDUMATCH_URL:-https://edumatch.asafarim.com}
        NEXT_PUBLIC_TESTORA_URL: ${NEXT_PUBLIC_TESTORA_URL}
        NEXT_PUBLIC_APPBUILDER_URL: ${NEXT_PUBLIC_APPBUILDER_URL}
        NEXT_PUBLIC_TIMELINEAI_URL: ${NEXT_PUBLIC_TIMELINEAI_URL:-https://tlai.asafarim.com}
        NEXT_PUBLIC_DEVTOOLS_URL: ${NEXT_PUBLIC_DEVTOOLS_URL:-https://asafarim.be}
        NEXT_PUBLIC_LABS_URL: ${NEXT_PUBLIC_LABS_URL:-https://labs.asafarim.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://asafarim.com
      AUTH_URL: https://asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://hub.asafarim.com
      AUTH_URL: https://hub.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  showcase:
    build:
      context: .
      dockerfile: apps/showcase/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://showcase.asafarim.com
      AUTH_URL: https://showcase.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: https://admin.asafarim.com
      AUTH_URL: https://admin.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - asafarim_net

  vionto:
    build:
      context: .
      dockerfile: apps/vionto/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://vionto.asafarim.com
      AUTH_URL: https://vionto.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  vionto-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.vionto-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    networks:
      - asafarim_net

  edumatch:
    build:
      context: .
      dockerfile: apps/edumatch/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://edumatch.asafarim.com
      NEXT_PUBLIC_EDUMATCH_URL: https://edumatch.asafarim.com
      AUTH_URL: https://edumatch.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    # /api/status pings the database and returns a non-2xx when it can't
    # reach it (see apps/edumatch/app/api/status/route.ts), so this reflects
    # real service health, not just "the process is running". The runner
    # image is node:24-alpine — busybox wget is present by default, curl is
    # not. #162.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - asafarim_net

  timelineai:
    build:
      context: .
      dockerfile: apps/timelineai/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://tlai.asafarim.com
      NEXT_PUBLIC_TIMELINEAI_URL: https://tlai.asafarim.com
      AUTH_URL: https://tlai.asafarim.com
      # Self-referencing URL for the export pipeline's headless Chromium
      # (lib/server/services/export.ts) — internal container networking,
      # not the public domain, so exports don't round-trip through Caddy/TLS.
      TIMELINEAI_INTERNAL_URL: http://localhost:3000
      TIMELINEAI_GUEST_IP_HASH_KEY: ${TIMELINEAI_GUEST_IP_HASH_KEY}
      # Caddy is one hop in front of every app in this stack.
      TIMELINEAI_TRUSTED_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  # Labs is intentionally the simplest service in this stack: a static
  # experiment registry with no auth, no shared database, and no worker —
  # see apps/labs/README.md. It only needs the app switcher's cross-app URLs.
  labs:
    build:
      context: .
      dockerfile: apps/labs/Dockerfile
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://labs.asafarim.com
    networks:
      - asafarim_net

  # testora keeps its OWN database, isolated from the shared Prisma Postgres.
  testora-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: e2e_testora
      POSTGRES_PASSWORD: ${TESTORA_DB_PASSWORD}
      POSTGRES_DB: e2e-testing-db
    ports:
      # Loopback only: lets host-side scripts (seed/inspect) reach it without
      # exposing testora's DB to the internet.
      - "127.0.0.1:5434:5432"
    volumes:
      - testora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_testora -d e2e-testing-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # One-shot: applies pending drizzle migrations, then exits. The app waits for
  # this to complete successfully before starting.
  testora-migrate:
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: migrator
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
    depends_on:
      testora-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # One-shot: reconciles the DB catalog (apps, requirements, suites, fixtures,
  # cases, target environments) with the code under src/data — the same thing
  # the Run page's "Update tests" button does, just run automatically on every
  # deploy so a catalog change (e.g. adding/removing an app under test) ships
  # without someone having to click the button in prod afterwards. Runs after
  # migrations so the schema it writes against is current.
  testora-seed:
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: migrator
    command: ["pnpm", "--filter", "testora", "db:seed"]
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
    depends_on:
      testora-postgres:
        condition: service_healthy
      testora-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  testora:
    build:
      context: .
      dockerfile: apps/testora/Dockerfile
      target: runner
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TESTORA_DATABASE_URL: postgres://e2e_testora:${TESTORA_DB_PASSWORD}@testora-postgres:5432/e2e-testing-db
      NEXT_PUBLIC_APP_URL: https://testora.asafarim.com
    depends_on:
      testora-postgres:
        condition: service_healthy
      testora-migrate:
        condition: service_completed_successfully
      testora-seed:
        condition: service_completed_successfully
    networks:
      - asafarim_net

  # appbuilder keeps its OWN database, isolated from the shared Prisma
  # Postgres and from testora's/others' app-local databases.
  appbuilder-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: ${APPBUILDER_DB_PASSWORD}
      POSTGRES_DB: appbuilder
    # No published port: private to asafarim_net. AppBuilder has no public
    # production service yet (ships in M11), so there is no host-side script
    # that needs loopback access the way testora's does.
    volumes:
      - appbuilder_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbuilder -d appbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asafarim_net

  # One-shot: applies pending drizzle migrations, then exits. Idempotent —
  # drizzle's migration journal makes reruns against an already-migrated
  # database a no-op. AppBuilder's own app service is not deployed yet (M11);
  # this job exists so the database and its migration lifecycle are already
  # correct and testable ahead of that milestone.
  appbuilder-migrate:
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      # APPBUILDER_DB_PASSWORD_URL is the URL-encoded form of
      # APPBUILDER_DB_PASSWORD (which may contain chars like '/' that are
      # illegal unencoded in a URI userinfo). POSTGRES_PASSWORD uses the raw
      # value; connection strings must use the encoded one.
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
    depends_on:
      appbuilder-postgres:
        condition: service_healthy
    networks:
      - asafarim_net

  # M07 AI generation worker — a standalone process, not the Next.js app
  # (which is not deployed yet, M11; see appbuilder-migrate above for the
  # same "staged ahead of the app itself" rationale). Consumes BullMQ
  # dispatch messages on the shared `redis` instance and drives
  # generation_jobs rows in appbuilder-postgres forward; see
  # docs/appbuilder-m07-ai-generation.md. Defaults to the deterministic fake
  # provider (APPBUILDER_AI_PROVIDER) so this service never makes a billable
  # call until an operator explicitly opts into "openai" with a real key.
  appbuilder-worker:
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
      REDIS_URL: redis://redis:6379
      APPBUILDER_AI_PROVIDER: ${APPBUILDER_AI_PROVIDER:-fake}
      APPBUILDER_AI_OPENAI_API_KEY: ${APPBUILDER_AI_OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      APPBUILDER_WORKER_CONCURRENCY: ${APPBUILDER_WORKER_CONCURRENCY:-2}
      APPBUILDER_WORKER_HEALTH_PORT: "3008"
    depends_on:
      appbuilder-postgres:
        condition: service_healthy
      appbuilder-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - asafarim_net

  appbuilder:
    build:
      context: .
      dockerfile: apps/appbuilder/Dockerfile
      target: runner
      args: *public-build-args
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APPBUILDER_DATABASE_URL: postgres://appbuilder:${APPBUILDER_DB_PASSWORD_URL}@appbuilder-postgres:5432/appbuilder
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://appbuilder.asafarim.com
      AUTH_URL: https://appbuilder.asafarim.com
    depends_on:
      postgres:
        condition: service_started
      platform-migrate:
        condition: service_completed_successfully
      appbuilder-postgres:
        condition: service_healthy
      appbuilder-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - asafarim_net

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - hub
      - showcase
      - admin
      - vionto
      - edumatch
      - testora
      - appbuilder
    networks:
      - asafarim_net

networks:
  asafarim_net:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  testora_postgres_data:
  appbuilder_postgres_data:
