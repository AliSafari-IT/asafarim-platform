packages:
  - "apps/*"
  - "packages/*"
  - "benchmarks/*"
allowBuilds:
  sharp: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  # bullmq optional native msgpack acceleration (falls back to pure JS)
  msgpackr-extract: true
  # eslint-config-next resolver
  unrs-resolver: true
  # edumatch PDF generation (Chromium download skipped in Docker via
  # PUPPETEER_SKIP_DOWNLOAD=true — see apps/edumatch/Dockerfile)
  puppeteer: true
minimumReleaseAgeExclude:
  - '@asafarim/envage@0.4.2'
overrides:
  # Force a single ioredis instance — bullmq pins an older minor and the
  # duplicated types are incompatible (queue connection typecheck fails).
  ioredis: ^5.11.1
  # Security (pnpm audit / .github/workflows/security-scan.yml): patched
  # versions of transitive dependencies whose parents haven't released a
  # fix yet. Each selector only matches the vulnerable range and lifts it
  # within the same major, so no consumer is moved across a major unless
  # noted. Drop an entry once its parent ships the fix on its own.
  # eslint / glob / rimraf / js-beautify -> minimatch, js-yaml
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "brace-expansion@<1.1.21": ^1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": ^2.1.7
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
  # prisma (CLI) -> @prisma/dev, @prisma/config; prisma pins mysql2 exactly.
  "fast-uri@<3.1.8": ^3.1.8
  "mysql2@<3.23.1": ^3.24.5
  "hono@<4.12.34": ^4.12.34
  "@hono/node-server@<1.19.15": ^1.19.15
  "valibot@<1.4.2": ^1.4.2
  # Major (7 -> 8): @prisma/config only calls deepmerge(); v8's breaks are
  # in deepmergeInto and the custom-merge type names.
  "deepmerge-ts@<8.0.0": ^8.0.2
  # postcss / next -> nanoid, browserslist
  "nanoid@>=3.0.0 <3.3.18": ^3.3.18
  "postcss@<8.5.23": ^8.5.28
  "browserslist@<4.28.7": ^4.28.7
  "baseline-browser-mapping@<2.11.0": ^2.11.0
  # testcafe -> moment; stripe -> qs
  "moment@<2.31.0": ^2.31.0
  "qs@>=6.0.0 <6.16.0": ^6.16.0
  # drizzle-kit (dev-only CLI) -> @esbuild-kit/core-utils pins esbuild 0.18.
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  # #817. drizzle-orm -> gel -> shell-quote (appbuilder, testora): critical,
  # quote() command injection via a line terminator (GHSA, fixed in 1.11.0).
  # gel 2.2.1 still allows the vulnerable range (^1.8.1).
  "shell-quote@<1.11.0": ^1.11.0
  # testcafe -> testcafe-hammerhead -> http-cache-semantics (testora e2e):
  # high, max-stale handling can disclose cross-user responses (fixed in 4.3.0).
  "http-cache-semantics@<4.3.0": ^4.3.0
  # postcss -> source-map-js (vite, next, tailwind): high, event-loop DoS
  # through crafted source maps (fixed in 1.2.2).
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  # tsup (appbuilder, vionto worker builds) pins esbuild ^0.27: low, arbitrary
  # file read through the development server (fixed in 0.28.1). tsup only
  # calls esbuild's build API, never serve.
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
